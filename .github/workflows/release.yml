name: Build Flight Studio

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install media engine
        run: brew install ffmpeg
      - name: Build app bundle
        run: ./build.sh
      - name: Run end-to-end media self-test
        run: .build/release/FlightStudio --selftest
      - name: Archive unsigned app
        run: ditto -c -k --sequesterRsrc --keepParent "build/Flight Studio.app" Flight-Studio-macos.zip
      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: Flight-Studio-macos
          path: Flight-Studio-macos.zip
          if-no-files-found: error
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Flight-Studio-macos.zip
          generate_release_notes: true
